name: Testing
on:
  - push
  - pull_request
jobs:
  testing:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install RGBDS
        run: |
          brew install rgbds
      - name: Check that example assembles correctly
        run: |
          rgbasm -Weverything example.asm
